services:
  postgres:
    image: postgres:15-alpine
    container_name: lifelink-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifelink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifelink"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lifelink-api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lifelink?schema=public
      PORT: 4000
      NODE_ENV: production
      JWT_ACCESS_SECRET: lifelink_jwt_access_secret_production_key_32bytes_long_min!
      JWT_REFRESH_SECRET: lifelink_jwt_refresh_secret_production_key_32bytes_long_min!
      CORS_ORIGIN: http://localhost:3000
      SMS_PROVIDER: mock
      WHATSAPP_PROVIDER: mock
      ABDM_PROVIDER: mock
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lifelink-web
    restart: always
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
